name: Tests
run-name: ${{ github.ref_name }} unit tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Chat and overlay tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Fetch libcurl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ -n "${CMAKE_TOOLCHAIN_FILE:-}" ]]; then args+=("-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}"); fi
          cmake -S tests -B build_tests -DCMAKE_BUILD_TYPE=RelWithDebInfo "${args[@]}"

      - name: Build
        run: cmake --build build_tests --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build_tests -C RelWithDebInfo --output-on-failure
